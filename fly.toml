# fly.toml - Fly.io Production Configuration for bList
app = "blist-radmuffin"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DATABASE_PATH = "/data/pins.db"
  RUST_LOG = "map_bucket_list=info,tower_http=info"

[mounts]
  source = "blist_data"
  destination = "/data"
  initial_size = "1GB"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512MB"
  cpus = 1
