<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="glow-grad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0" />
    </radialGradient>

    <!-- Pin Head Gradient -->
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Star / Accent Gradient -->
    <linearGradient id="star-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35" />
    </filter>
    
    <filter id="pin-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#091e42" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)" />
  <rect width="512" height="512" rx="115" fill="url(#glow-grad)" />

  <!-- Subtle Map Grid Accent Lines -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" fill="none">
    <circle cx="256" cy="230" r="140" stroke-dasharray="8 6" />
    <circle cx="256" cy="230" r="190" stroke-dasharray="6 8" />
    <path d="M 60 230 L 452 230" />
    <path d="M 256 40 L 256 420" />
    <path d="M 120 100 L 392 360" />
  </g>

  <!-- Main Map Pin Graphic -->
  <g filter="url(#pin-shadow)">
    <!-- Map Pin Path -->
    <path d="M 256 70 
             C 175 70 110 135 110 216 
             C 110 315 235 415 248 426 
             C 252 430 260 430 264 426 
             C 277 415 402 315 402 216 
             C 402 135 337 70 256 70 Z" 
          fill="url(#pin-grad)" />

    <!-- Pin Inner Core Circle -->
    <circle cx="256" cy="215" r="75" fill="#2563eb" />
    <circle cx="256" cy="215" r="66" fill="#1e40af" />

    <!-- Bucket List Checkmark / Star in Center -->
    <path d="M 230 215 L 248 233 L 285 194" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Glowing Accent Star in Top Right of Pin -->
  <g filter="url(#drop-shadow)" transform="translate(325, 110) scale(0.9)">
    <circle cx="25" cy="25" r="28" fill="#ffffff" />
    <polygon points="25,5 31,18 45,19 34,29 38,43 25,35 12,43 16,29 5,19 19,18" fill="url(#star-grad)" />
  </g>
</svg>
