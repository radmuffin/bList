<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient for Full Bleed Maskable Area -->
    <linearGradient id="bg-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <radialGradient id="glow-grad-mask" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="pin-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <linearGradient id="star-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="shadow-mask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#091e42" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Full-bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="url(#bg-grad-mask)" />
  <rect width="512" height="512" fill="url(#glow-grad-mask)" />

  <!-- Centered Scaled Content (80% safe zone) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- Map Grid Lines -->
    <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="3" fill="none">
      <circle cx="256" cy="230" r="140" stroke-dasharray="8 6" />
      <path d="M 60 230 L 452 230" />
      <path d="M 256 40 L 256 420" />
    </g>

    <!-- Main Map Pin Graphic -->
    <g filter="url(#shadow-mask)">
      <path d="M 256 70 
               C 175 70 110 135 110 216 
               C 110 315 235 415 248 426 
               C 252 430 260 430 264 426 
               C 277 415 402 315 402 216 
               C 402 135 337 70 256 70 Z" 
            fill="url(#pin-grad-mask)" />

      <!-- Pin Inner Core -->
      <circle cx="256" cy="215" r="75" fill="#2563eb" />
      <circle cx="256" cy="215" r="66" fill="#1e40af" />

      <!-- Bucket List Checkmark -->
      <path d="M 230 215 L 248 233 L 285 194" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="14" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>

    <!-- Glowing Star -->
    <g transform="translate(325, 110) scale(0.9)">
      <circle cx="25" cy="25" r="28" fill="#ffffff" />
      <polygon points="25,5 31,18 45,19 34,29 38,43 25,35 12,43 16,29 5,19 19,18" fill="url(#star-grad-mask)" />
    </g>
  </g>
</svg>
