<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>bList - Visual Map Bucket List</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-main-row">
        <div class="header-left">
          <button id="toggle-sidebar-btn" class="btn-icon-header" onclick="toggleSidebar()" title="Toggle Sidebar">
            <i data-lucide="panel-left"></i>
          </button>
          <div class="brand" onclick="resetMapView()">
            <span class="logo-icon">🗺️</span>
            <h1 class="brand-title">bList</h1>
          </div>
        </div>

        <!-- Desktop Omni Bar -->
        <form id="save-link-form" class="save-link-bar desktop-only" onsubmit="handleSaveLinkSubmit(event)">
          <div class="input-wrapper">
            <i data-lucide="link" class="input-icon"></i>
            <input 
              type="url" 
              id="save-url-input" 
              placeholder="Paste Google Maps, Instagram, Apple Maps, or article link..." 
              required
              autocomplete="off"
            />
          </div>
          <button type="submit" id="save-link-btn" class="btn btn-primary">
            <i data-lucide="plus-circle" class="btn-icon"></i>
            <span>Save Place</span>
          </button>
        </form>

        <div class="header-actions">
          <button class="btn btn-surprise" onclick="surpriseMe()" title="Pick a random unvisited place">
            <i data-lucide="sparkles" class="btn-icon"></i>
            <span class="btn-text">Surprise Me</span>
          </button>
          <button class="btn btn-secondary" onclick="openManualPinModal()" title="Add place manually">
            <i data-lucide="plus" class="btn-icon"></i>
            <span class="btn-text">Add Place</span>
          </button>
          <button class="btn btn-ghost desktop-only" onclick="exportData('geojson')" title="Export GeoJSON">
            <i data-lucide="download" class="btn-icon"></i>
            <span class="btn-text">Export</span>
          </button>
        </div>
      </div>

      <!-- Mobile Omni Bar -->
      <div class="header-mobile-bar mobile-only">
        <form id="save-link-form-mobile" class="save-link-bar-mobile" onsubmit="handleSaveLinkSubmit(event, 'save-url-input-mobile')">
          <div class="input-wrapper input-wrapper-mobile">
            <i data-lucide="link" class="input-icon"></i>
            <input 
              type="url" 
              id="save-url-input-mobile" 
              placeholder="Paste place or article link..." 
              required
              autocomplete="off"
            />
            <button type="submit" class="btn-inline-save">
              <i data-lucide="plus"></i>
              <span>Save</span>
            </button>
          </div>
        </form>
      </div>
    </header>

    <!-- Main Container: Sidebar + Map -->
    <div class="main-content">
      <!-- Sidebar Drawer -->
      <aside class="sidebar" id="sidebar">
        <!-- Drawer Drag Handle for Mobile -->
        <div class="drawer-handle-bar mobile-only" onclick="toggleSidebar()">
          <div class="drawer-handle"></div>
        </div>

        <div class="sidebar-header">
          <!-- Multi-List & Trips Dropdown -->
          <div class="list-selector-wrapper">
            <div class="list-selector-header">
              <span class="section-label">TRIP / COLLECTION</span>
              <button class="btn-link-action" onclick="openNewListModal()" title="Create New List">+ New List</button>
            </div>
            <div class="custom-select-container">
              <select id="list-select" onchange="handleListChange(event)">
                <option value="all">📁 All Places</option>
                <!-- Populated dynamically -->
              </select>
              <i data-lucide="chevron-down" class="select-arrow-icon"></i>
            </div>
          </div>

          <!-- Search & Sort Row -->
          <div class="search-and-sort-row">
            <div class="search-box">
              <i data-lucide="search" class="search-icon"></i>
              <input type="text" id="search-input" placeholder="Search places, notes..." oninput="handleSearch(event)">
            </div>
            <select id="sort-select" class="sort-select" onchange="handleSortChange(event)">
              <option value="newest">✨ Newest</option>
              <option value="nearest">📍 Nearest</option>
              <option value="az">🔤 A-Z</option>
            </select>
          </div>

          <!-- Status Filters -->
          <div class="filter-tabs">
            <button class="filter-tab active" data-status="all" onclick="setStatusFilter('all')">All (<span id="count-all">0</span>)</button>
            <button class="filter-tab" data-status="bucket" onclick="setStatusFilter('bucket')">🎯 Want to Go (<span id="count-bucket">0</span>)</button>
            <button class="filter-tab" data-status="visited" onclick="setStatusFilter('visited')">✅ Visited (<span id="count-visited">0</span>)</button>
          </div>

          <!-- Category Tags -->
          <div class="categories-bar" id="categories-bar"></div>
        </div>

        <!-- Pin Cards List -->
        <div class="pin-list" id="pin-list">
          <div class="empty-state" id="empty-state">
            <div class="empty-icon">📍</div>
            <h3>No places saved yet</h3>
            <p>Paste a Google Maps, Instagram, or travel link above to add your first destination!</p>
          </div>
        </div>
      </aside>

      <!-- Interactive Map -->
      <main class="map-container">
        <div id="map"></div>
        
        <!-- Map Floating Action Buttons (Right Side) -->
        <div class="map-floating-controls">
          <!-- Layer Switcher -->
          <div class="layer-control-wrapper">
            <button class="map-fab" id="layer-fab" onclick="toggleLayerMenu()" title="Map Style">
              <i data-lucide="layers"></i>
            </button>
            <div class="layer-menu hidden" id="layer-menu">
              <button class="layer-opt active" data-layer="osm" onclick="switchMapLayer('osm')">🗺️ Streets (OSM)</button>
              <button class="layer-opt" data-layer="light" onclick="switchMapLayer('light')">☀️ Clean Light</button>
              <button class="layer-opt" data-layer="dark" onclick="switchMapLayer('dark')">🌙 Dark Mode</button>
              <button class="layer-opt" data-layer="satellite" onclick="switchMapLayer('satellite')">🛰️ Satellite</button>
            </div>
          </div>

          <!-- GPS Locate Button -->
          <button class="map-fab" id="locate-fab" onclick="locateUser()" title="Find My Location">
            <i data-lucide="crosshair"></i>
          </button>

          <!-- Surprise Pick Button on Map -->
          <button class="map-fab fab-highlight" onclick="surpriseMe()" title="Surprise Me (Random Place)">
            <i data-lucide="dice-5"></i>
          </button>

          <!-- Reset / Fit All Pins View -->
          <button class="map-fab" onclick="resetMapView()" title="Fit All Pins">
            <i data-lucide="maximize-2"></i>
          </button>
        </div>

        <!-- Mobile Bottom Floating Switcher -->
        <div class="mobile-view-toggle mobile-only">
          <button class="toggle-pill active" id="btn-show-map" onclick="showMobileView('map')">
            <i data-lucide="map"></i>
            <span>Map</span>
          </button>
          <button class="toggle-pill" id="btn-show-list" onclick="showMobileView('list')">
            <i data-lucide="list"></i>
            <span>List (<span id="mobile-count">0</span>)</span>
          </button>
        </div>

        <div class="map-overlay-tip desktop-only">
          <i data-lucide="mouse-pointer-click"></i>
          <span>Click anywhere on map to add a place</span>
        </div>
      </main>
    </div>
  </div>

  <!-- Ingest Loading Overlay -->
  <div id="loading-overlay" class="modal-overlay hidden">
    <div class="loading-card">
      <div class="spinner"></div>
      <h3 id="loading-title">Saving place...</h3>
      <p id="loading-desc">Extracting metadata and resolving GPS coordinates</p>
    </div>
  </div>

  <!-- Manual / Edit Pin Modal -->
  <div id="pin-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title">Add Place</h2>
        <button class="btn-close" onclick="closePinModal()">&times;</button>
      </div>
      <form id="pin-form" onsubmit="handlePinFormSubmit(event)">
        <input type="hidden" id="form-pin-id">
        
        <div class="form-group">
          <label for="form-title">Place / Destination Name *</label>
          <input type="text" id="form-title" required placeholder="e.g. Chicken Boy, Eiffel Tower, Joe's Pizza">
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="form-list-id">Collection / Trip</label>
            <select id="form-list-id"></select>
          </div>
          <div class="form-group flex-1">
            <label for="form-category">Category</label>
            <select id="form-category">
              <option value="Food & Drink">🍔 Food & Drink</option>
              <option value="Cafe">☕ Cafe</option>
              <option value="Sightseeing">🏛️ Sightseeing</option>
              <option value="Nature & Outdoors">🏞️ Nature & Outdoors</option>
              <option value="Hotel & Stay">🏨 Hotel & Stay</option>
              <option value="Shopping">🛍️ Shopping</option>
              <option value="Place" selected>📍 Place / Landmark</option>
              <option value="General">📌 General</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="form-lat">Latitude *</label>
            <input type="number" step="any" id="form-lat" required placeholder="34.1085">
          </div>
          <div class="form-group flex-1">
            <label for="form-lon">Longitude *</label>
            <input type="number" step="any" id="form-lon" required placeholder="-118.1943">
          </div>
        </div>

        <div class="form-group">
          <label for="form-address">Address</label>
          <input type="text" id="form-address" placeholder="e.g. 5558 N Figueroa St, Los Angeles, CA">
        </div>

        <div class="form-row">
          <div class="form-group flex-1">
            <label for="form-visited">Status</label>
            <select id="form-visited">
              <option value="false">🎯 Want to Go</option>
              <option value="true">✅ Visited</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label for="form-image">Photo URL</label>
            <input type="url" id="form-image" placeholder="https://example.com/photo.jpg">
          </div>
        </div>

        <div class="form-group">
          <label for="form-source">Source Link</label>
          <input type="url" id="form-source" placeholder="https://maps.google.com/... or instagram.com/...">
        </div>

        <div class="form-group">
          <label for="form-notes">Personal Notes / Tips</label>
          <textarea id="form-notes" rows="3" placeholder="Great photo spot, best coffee, sunset view..."></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closePinModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Place</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Create New List Modal -->
  <div id="new-list-modal" class="modal-overlay hidden">
    <div class="modal-card modal-sm">
      <div class="modal-header">
        <h2>Create New Trip / List</h2>
        <button class="btn-close" onclick="closeNewListModal()">&times;</button>
      </div>
      <form id="new-list-form" onsubmit="handleCreateListSubmit(event)">
        <div class="form-group">
          <label for="new-list-name">List Name *</label>
          <input type="text" id="new-list-name" required placeholder="e.g. Tokyo 2026, Weekend Eats, Roadtrip">
        </div>

        <div class="form-group">
          <label>Pick an Icon</label>
          <div class="emoji-picker-grid" id="emoji-picker">
            <button type="button" class="emoji-opt active" onclick="selectListIcon('📍')">📍</button>
            <button type="button" class="emoji-opt" onclick="selectListIcon('✈️')">✈️</button>
            <button type="button" class="emoji-opt" onclick="selectListIcon('🍜')">🍜</button>
            <button type="button" class="emoji-opt" onclick="selectListIcon('☕')">☕</button>
            <button type="button" class="emoji-opt" onclick="selectListIcon('🏔️')">🏔️</button>
            <button type="button" class="emoji-opt" onclick="selectListIcon('🏖️')">🏖️</button>
            <button type="button" class="emoji-opt" onclick="selectListIcon('🏨')">🏨</button>
            <button type="button" class="emoji-opt" onclick="selectListIcon('🛍️')">🛍️</button>
            <button type="button" class="emoji-opt" onclick="selectListIcon('🚗')">🚗</button>
            <button type="button" class="emoji-opt" onclick="selectListIcon('🌟')">🌟</button>
          </div>
          <input type="hidden" id="new-list-icon" value="📍">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeNewListModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Create List</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
